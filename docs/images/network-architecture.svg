<rect width="1500" height="1114" fill="#FFFFFF"/>
<text x="750" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Network architecture — three-node Raft cluster</text>
<text x="750" y="64" text-anchor="middle" font-size="14" fill="#64748B">Every node serves clients and talks to every other node. Followers forward client commands to the group leader over the peer port.</text>
<rect x="30" y="86" width="1440" height="112" rx="14" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1.5"/>
<text x="52" y="110" font-size="13" font-weight="700" fill="#0369A1" letter-spacing="1">CLIENT NETWORK  ·  trusted subnets only  ·  clients may use any node</text>
<rect x="230" y="120" width="440" height="68" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#sh)"/>
<text x="450.0" y="147" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8">Browser · curl · HTTP clients</text>
<text x="450.0" y="169" text-anchor="middle" font-size="13" fill="#334155">HTTP(S) :8080  ·  Authorization: Bearer &lt;KV_CLIENT_TOKEN&gt;</text>
<rect x="830" y="120" width="440" height="68" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#sh)"/>
<text x="1050.0" y="147" text-anchor="middle" font-size="16" font-weight="700" fill="#0F766E">RESP clients · redis-cli · applications</text>
<text x="1050.0" y="169" text-anchor="middle" font-size="13" fill="#334155">RESP :6379 (TLS)  ·  AUTH &lt;KV_CLIENT_TOKEN&gt;</text>
<rect x="30" y="256" width="1440" height="586" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="52" y="282" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">RAFT CLUSTER NETWORK  ·  Docker bridge network or separate hosts  ·  each node must reach every other node's Raft port</text>
<line x1="150" y1="230" x2="1350" y2="230" stroke="#2563EB" stroke-width="2.5"/>
<line x1="150" y1="244" x2="1350" y2="244" stroke="#0D9488" stroke-width="2.5"/>
<text x="1358" y="234" font-size="11" fill="#2563EB" font-weight="700">HTTP(S)</text>
