<text x="750" y="510" text-anchor="middle" font-size="13" fill="#3730A3">MultiRaftStore  →  groupFor(key)</text>
<text x="750" y="532" text-anchor="middle" font-size="13" fill="#3730A3">RaftGroup g1 … gN  (one replica of each group)</text>
<text x="750" y="554" text-anchor="middle" font-size="12" fill="#6366F1">state machine: RedisStore</text>
