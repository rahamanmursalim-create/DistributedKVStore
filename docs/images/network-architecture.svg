<text x="750" y="635" text-anchor="middle" font-size="14" font-weight="700" fill="#14532D">Raft RPC :7000 + group index  ·  mutual TLS</text>
<line x1="750" y1="566" x2="750" y2="608" stroke="#16A34A" stroke-width="1.5" marker-end="url(#aG)" marker-start="url(#aG)"/>
<text x="570" y="678" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">LOCAL STORAGE (not shared between nodes)</text>
<rect x="570" y="688" width="360" height="44" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
<text x="750" y="707" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">DATA_DIR/raft/&lt;group&gt;/</text>
