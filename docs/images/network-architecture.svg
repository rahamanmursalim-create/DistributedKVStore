<rect x="1310" y="314" width="116" height="22" rx="11" fill="#64748B"/>
<text x="1319" y="330" font-size="12" font-weight="700" fill="#FFFFFF">follower of g1</text>
<text x="1060" y="368" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">CLIENT LISTENERS</text>
<rect x="1060" y="378" width="170" height="40" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="1145" y="403" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A8A">HTTP(S) :8080</text>
<rect x="1250" y="378" width="170" height="40" rx="8" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
<text x="1335" y="403" text-anchor="middle" font-size="14" font-weight="600" fill="#115E59">RESP :6379</text>
<line x1="1145" y1="230" x2="1145" y2="306" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="1145" y1="346" x2="1145" y2="378" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="1335" y1="244" x2="1335" y2="306" stroke="#0D9488" stroke-width="2.5" marker-end="url(#aT)"/>
<line x1="1335" y1="346" x2="1335" y2="378" stroke="#0D9488" stroke-width="2.5" marker-end="url(#aT)"/>
<text x="1060" y="452" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">APPLICATION RUNTIME</text>
<rect x="1060" y="462" width="360" height="104" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
<text x="1240" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#312E81">CommandHandler · WebServer</text>
<text x="1240" y="510" text-anchor="middle" font-size="13" fill="#3730A3">MultiRaftStore  →  groupFor(key)</text>
<text x="1240" y="532" text-anchor="middle" font-size="13" fill="#3730A3">RaftGroup g1 … gN  (one replica of each group)</text>
<text x="1240" y="554" text-anchor="middle" font-size="12" fill="#6366F1">state machine: RedisStore</text>
<line x1="1145" y1="418" x2="1145" y2="462" stroke="#475569" stroke-width="1.5" marker-end="url(#aK)"/>
<line x1="1335" y1="418" x2="1335" y2="462" stroke="#475569" stroke-width="1.5" marker-end="url(#aK)"/>
<text x="1060" y="598" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">PEER LISTENER</text>
<rect x="1060" y="608" width="360" height="44" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
<text x="1240" y="635" text-anchor="middle" font-size="14" font-weight="700" fill="#14532D">Raft RPC :7000 + group index  ·  mutual TLS</text>
<line x1="1240" y1="566" x2="1240" y2="608" stroke="#16A34A" stroke-width="1.5" marker-end="url(#aG)" marker-start="url(#aG)"/>
<text x="1060" y="678" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">LOCAL STORAGE (not shared between nodes)</text>
<rect x="1060" y="688" width="360" height="44" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
<text x="1240" y="707" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">DATA_DIR/raft/&lt;group&gt;/</text>
<text x="1240" y="723" text-anchor="middle" font-size="12" fill="#9D174D">Raft log · metadata · state (WAL or RocksDB) · snapshots</text>
<line x1="460" y1="630" x2="560" y2="630" stroke="#16A34A" stroke-width="3" marker-start="url(#aG)" marker-end="url(#aG)"/>
<text x="510.0" y="622" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">mTLS</text>
<line x1="950" y1="630" x2="1050" y2="630" stroke="#16A34A" stroke-width="3" marker-start="url(#aG)" marker-end="url(#aG)"/>
<text x="1000.0" y="622" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">mTLS</text>
<path d="M260,746 V790 H1240 V746" fill="none" stroke="#16A34A" stroke-width="3" marker-start="url(#aG)" marker-end="url(#aG)"/>
<rect x="470" y="776" width="560" height="28" rx="14" fill="#FFFFFF" stroke="#16A34A"/>
<text x="750" y="795" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">full reachability · each call opens its own mutual-TLS connection</text>
<circle cx="1145" cy="275" r="14" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
<text x="1145" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<text x="1166" y="279" font-size="11" font-weight="700" fill="#6D28D9">write → follower n3</text>
<circle cx="1240" cy="770" r="14" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
<text x="1240" y="775" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<path d="M1240,746 V790" stroke="none"/>
<text x="1010" y="830" font-size="11" font-weight="700" fill="#6D28D9">forwarded command (REQUEST) → leader n1</text>
<circle cx="505" cy="600" r="14" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
<text x="505" y="605" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<text x="505" y="660" text-anchor="middle" font-size="11" font-weight="700" fill="#6D28D9">replicate</text>
<rect x="30" y="858" width="345" height="236" rx="12" fill="#0F172A"/>
<text x="50" y="888" font-size="12" font-weight="700" fill="#7DD3FC" letter-spacing="1.2">CLIENT PLANE</text>
<text x="50" y="916" font-size="12.5" fill="#E2E8F0" xml:space="preserve">HTTP(S) :8080 and RESP :6379 on every node.</text>
<text x="50" y="940" font-size="12.5" fill="#E2E8F0" xml:space="preserve">TLS is enabled when KV_TLS_KEYSTORE is set;</text>
<text x="50" y="964" font-size="12.5" fill="#E2E8F0" xml:space="preserve">the server proves its identity to the client.</text>
<text x="50" y="988" font-size="12.5" fill="#E2E8F0" xml:space="preserve">Callers authenticate with a Bearer token</text>
<text x="50" y="1012" font-size="12.5" fill="#E2E8F0" xml:space="preserve">(HTTP) or AUTH (RESP): KV_CLIENT_TOKEN.</text>
<text x="50" y="1036" font-size="12.5" fill="#E2E8F0" xml:space="preserve">A non-loopback KV_BIND_HOST requires TLS</text>
<text x="50" y="1060" font-size="12.5" fill="#E2E8F0" xml:space="preserve">and KV_CLIENT_TOKEN, or startup is refused.</text>
<rect x="395" y="858" width="345" height="236" rx="12" fill="#0F172A"/>
<text x="415" y="888" font-size="12" font-weight="700" fill="#86EFAC" letter-spacing="1.2">PEER PLANE</text>
<text x="415" y="916" font-size="12.5" fill="#E2E8F0" xml:space="preserve">Raft RPC on :7000 + group index (KV_RAFT_PORT),</text>
<text x="415" y="940" font-size="12.5" fill="#E2E8F0" xml:space="preserve">bound to KV_RAFT_BIND_HOST (default 0.0.0.0).</text>
<text x="415" y="964" font-size="12.5" fill="#E2E8F0" xml:space="preserve">Mutual TLS: the server requires a client</text>
<text x="415" y="988" font-size="12.5" fill="#E2E8F0" xml:space="preserve">certificate. Every call also carries the</text>
<text x="415" y="1012" font-size="12.5" fill="#E2E8F0" xml:space="preserve">group ID and KV_CLUSTER_TOKEN (constant-time</text>
<text x="415" y="1036" font-size="12.5" fill="#E2E8F0" xml:space="preserve">check). Non-loopback peers require both</text>
<text x="415" y="1060" font-size="12.5" fill="#E2E8F0" xml:space="preserve">mutual TLS and the token, or startup fails.</text>
<rect x="760" y="858" width="345" height="236" rx="12" fill="#0F172A"/>
<text x="780" y="888" font-size="12" font-weight="700" fill="#FCD34D" letter-spacing="1.2">PEER RPC WIRE FORMAT</text>
<text x="780" y="916" font-size="12.5" fill="#E2E8F0" xml:space="preserve">One request per TCP connection, new handshake.</text>
<text x="780" y="940" font-size="12.5" fill="#E2E8F0" xml:space="preserve">Length-prefixed frame, at most 16 MiB.</text>
<text x="780" y="964" font-size="12.5" fill="#E2E8F0" xml:space="preserve">Source and target node IDs are validated</text>
<text x="780" y="988" font-size="12.5" fill="#E2E8F0" xml:space="preserve">against the KV_RAFT_PEERS list.</text>
<text x="780" y="1012" font-size="12.5" fill="#E2E8F0" xml:space="preserve">Types: VOTE, APPEND_ENTRIES, HEARTBEAT,</text>
<text x="780" y="1036" font-size="12.5" fill="#E2E8F0" xml:space="preserve">INSTALL_SNAPSHOT, REQUEST (forwarded</text>
<text x="780" y="1060" font-size="12.5" fill="#E2E8F0" xml:space="preserve">commands/reads), READ_FRESHNESS.</text>
<rect x="1125" y="858" width="345" height="236" rx="12" fill="#0F172A"/>
<text x="1145" y="888" font-size="12" font-weight="700" fill="#C4B5FD" letter-spacing="1.2">WRITE FLOW OVER THE NETWORK</text>
<text x="1145" y="916" font-size="12.5" fill="#E2E8F0" xml:space="preserve">1  Client sends the write to any node (n3).</text>
<text x="1145" y="940" font-size="12.5" fill="#E2E8F0" xml:space="preserve">2  A follower forwards it to the group leader</text>
<text x="1145" y="964" font-size="12.5" fill="#E2E8F0" xml:space="preserve">    (n1) over the peer port.</text>
<text x="1145" y="988" font-size="12.5" fill="#E2E8F0" xml:space="preserve">3  The leader replicates AppendEntries; a</text>
<text x="1145" y="1012" font-size="12.5" fill="#E2E8F0" xml:space="preserve">    majority acknowledgement commits it.</text>
<text x="1145" y="1036" font-size="12.5" fill="#E2E8F0" xml:space="preserve">4  The reply returns leader → n3 → client.</text>
<text x="1145" y="1060" font-size="12.5" fill="#E2E8F0" xml:space="preserve">Follower reads ask the leader READ_FRESHNESS.</text>
</svg>