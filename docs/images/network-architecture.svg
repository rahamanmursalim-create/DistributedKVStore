<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1114" width="1500" height="1114" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
